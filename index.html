<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root {
      --bg: #000000;
      --card-w: 280px;
      --card-h: 360px;
      --spoiler-grey: #3a3a3a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      min-height: 100%;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, var(--card-w));
      justify-content: space-between;
      gap: 48px 0;
      max-width: 800px;
      margin: 0 auto;
      padding: 64px 64px;
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1200px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 4px;
      overflow: hidden;
    }

    /* FRONT face: holds both the spoiler cover and the photo, stacked */
    .card-front {
      position: relative;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spoiler-cover {
      position: absolute;
      inset: 0;
      background: var(--spoiler-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
      z-index: 2;
    }

    .spoiler-cover span {
      color: #cfcfcf;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .card.revealed .spoiler-cover {
      opacity: 0;
      pointer-events: none;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #0d0d0d;
      border: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }

    .card-back p {
      color: #e8e8e8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0;
    }

    @media (max-width: 620px) {
      .gallery {
        grid-template-columns: var(--card-w);
        justify-content: center;
        padding: 48px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="gallery">

    <div class="card" id="card1">
      <div class="card-inner">
        <div class="card-face card-front">
          <img src="fotos/first.jpg" alt="">
          <div class="spoiler-cover"><span>SPOILER</span></div>
        </div>
        <div class="card-face card-back">
          <p>Put your first message here.</p>
        </div>
      </div>
    </div>

    <div class="card" id="card2">
      <div class="card-inner">
        <div class="card-face card-front">
          <img src="fotos/second.jpg" alt="">
          <div class="spoiler-cover"><span>SPOILER</span></div>
        </div>
        <div class="card-face card-back">
          <p>Put your second message here.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.querySelectorAll('.card').forEach(function (card) {
      card.addEventListener('click', function () {
        if (!card.classList.contains('revealed')) {
          // first click: reveal the photo
          card.classList.add('revealed');
        } else {
          // subsequent clicks: flip between photo and message
          card.classList.toggle('flipped');
        }
      });
    });
  </script>

</body>

</html>
