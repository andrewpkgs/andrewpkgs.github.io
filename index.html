<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  :root {
    --bg: #000000;
    --card-w: 300px;
    --card-h: 380px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    padding-bottom: 64px;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1200px;
    margin-bottom: 48px;
  }

  .card:last-child {
    margin-bottom: 0;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 4px;
    overflow: hidden;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-back {
    transform: rotateY(180deg);
    background: #0d0d0d;
    border: 1px solid #262626;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }

  .card-back p {
    color: #e8e8e8;
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="card" id="card1">
    <div class="card-inner">
      <div class="card-face card-front">
        <img src="fotos/first.jpg" alt="">
      </div>
      <div class="card-face card-back">
        <p>Put your first message here.</p>
      </div>
    </div>
  </div>

  <div class="card" id="card2">
    <div class="card-inner">
      <div class="card-face card-front">
        <img src="fotos/second.jpg" alt="">
      </div>
      <div class="card-face card-back">
        <p>Put your second message here.</p>
      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('click', function () {
      card.classList.toggle('flipped');
    });
  });
</script>

</body>
</html>
